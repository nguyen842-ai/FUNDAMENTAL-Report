<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fundamental Report</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================================
           1. CẤU HÌNH BIẾN GIAO DIỆN (THEME VARIABLES)
           ========================================================= */
        :root {
            --bg-color: #f1f5f9; --primary: #3b82f6; --primary-hover: #2563eb; --border: #cbd5e1;
            --text-main: #0f172a; --text-sub: #475569; --white: #ffffff;
            --color-tot: #16a34a; --color-dat: #86efac; --color-cai-thien: #fef08a; --color-khong-hq: #fca5a5;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.05);
            --badge-bg: #e2e8f0; --warning-bg: #fff7ed; --warning-border: #f97316;
            --header-color: #1e3a8a; --table-header: #f8fafc;
            --radius-lg: 20px; --radius-md: 12px;
        }

        body.dark-mode {
            --bg-color: #0f172a; --primary: #3b82f6; --primary-hover: #60a5fa; --border: #334155;
            --text-main: #f8fafc; --text-sub: #94a3b8; --white: #1e293b;
            --color-tot: #22c55e; --color-dat: #4ade80; --color-cai-thien: #facc15; --color-khong-hq: #ef4444;
            --card-shadow: 0 8px 16px rgba(0,0,0,0.2);
            --badge-bg: #334155; --warning-bg: #451a03; --warning-border: #ea580c;
            --header-color: #38bdf8; --table-header: #0f172a;
        }

        body, html { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); font-size: 13px; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 1500px; margin: 0 auto; padding: 20px; }
        
        /* =========================================================
           2. HEADER & CÀI ĐẶT
           ========================================================= */
        .header { background: var(--white); padding: 20px 24px; border-radius: var(--radius-lg); box-shadow: var(--card-shadow); margin-bottom: 24px; transition: 0.3s; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px;}
        .header h1 { margin: 0; font-size: 1.5em; color: var(--header-color); text-transform: uppercase; font-weight: 700; letter-spacing: -0.5px;}

        .settings-content { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .set-group { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text-sub); }
        .set-btn { padding: 6px 12px; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text-main); border-radius: var(--radius-md); font-weight: 600; transition: 0.2s; font-size: 0.95em;}
        .set-btn:hover { background: var(--badge-bg); }
        .set-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        input[type="range"] { cursor: pointer; max-width: 80px;}

        .status-divider { height: 24px; width: 1px; background: var(--border); margin: 0 3px; }
        .status-badge { font-weight: 700; padding: 4px 10px; border-radius: 6px; background: var(--badge-bg); transition: 0.3s;}

        /* =========================================================
           3. BỘ LỌC (FILTERS)
           ========================================================= */
        .filters { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; min-width: 180px; flex-grow: 1;}
        .filter-group label { font-weight: 600; margin-bottom: 6px; color: var(--text-sub); text-transform: uppercase; font-size: 11px;}
        .filter-group select { padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); outline: none; font-size: 1em; background: var(--badge-bg); color: var(--text-main); transition: 0.2s; font-weight: 600;}
        .filter-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); background: var(--white);}
        
        /* =========================================================
           4. MAIN TABS & SUB TABS
           ========================================================= */
        .main-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid var(--border); }
        .tab-btn { padding: 12px 20px; background: transparent; border: none; font-weight: 700; font-size: 1.1em; color: var(--text-sub); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: 0.2s;}
        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        .sub-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;}
        .sub-tab-btn { padding: 8px 18px; background: var(--badge-bg); border: 1px solid var(--border); border-radius: 20px; font-weight: 600; font-size: 0.95em; color: var(--text-sub); cursor: pointer; transition: 0.2s;}
        .sub-tab-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary);}
        .sub-tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);}

        /* =========================================================
           5. BẢNG HIỂN THỊ & ACCORDION
           ========================================================= */
        #table-wrapper-main { transition: opacity 0.2s ease; }
        
        .entity-section { margin-bottom: 35px; }
        .entity-title {
            background: var(--header-color); color: #ffffff; padding: 12px 20px; border-radius: var(--radius-md) var(--radius-md) 0 0;
            margin: 0; font-size: 1.1em; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;
        }

        .table-container { background: var(--white); border-radius: 0 0 var(--radius-md) var(--radius-md); box-shadow: var(--card-shadow); overflow-x: auto; border: 1px solid var(--border); border-top: none; max-height: 500px;}
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 900px; font-size: 1em; }
        th, td { padding: 14px; text-align: center; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
        th:last-child, td:last-child { border-right: none; }
        
        th { background: var(--table-header); font-weight: 700; color: var(--text-main); position: sticky; top: 0; z-index: 10; text-transform: uppercase; font-size: 11px;}
        td { color: var(--text-main); }
        
        .col-sticky-1 { position: sticky; left: 0; background: var(--white); z-index: 5; text-align: left !important; font-weight: 700;}
        .col-sticky-2 { position: sticky; left: 100px; background: var(--white); z-index: 5; text-align: left !important; font-weight: 700; color: var(--warning-border);}
        
        th.col-sticky-1, th.col-sticky-2 { background: var(--table-header); z-index: 15; }
        
        .metric-name { text-align: left !important; font-weight: 600; color: var(--text-sub); }
        .row-highlight { background: rgba(59, 130, 246, 0.03); }
        .val-primary { color: var(--primary); font-weight: bold; }
        .val-success { color: var(--color-tot); font-weight: bold; }

        /* Accordion (Nhân sự nghỉ việc & Special) */
        .acc-group {
            margin-top: 30px; border-radius: var(--radius-md); border: 1px solid var(--border);
            background: var(--white); box-shadow: var(--card-shadow);
        }
        .acc-summary {
            padding: 16px 20px; font-weight: 700; font-size: 1.1em; color: var(--text-main);
            background: var(--badge-bg); cursor: pointer; list-style: none; display: flex; align-items: center;
            transition: 0.2s; text-transform: uppercase; border-radius: var(--radius-md);
        }
        .acc-group[open] .acc-summary { border-radius: var(--radius-md) var(--radius-md) 0 0; border-bottom: 1px solid var(--border); }
        .acc-summary::-webkit-details-marker { display: none; }
        .acc-summary:hover { background: rgba(0,0,0,0.05); }
        .acc-summary::before { content: '▶'; font-size: 0.8em; margin-right: 12px; color: var(--primary); transition: transform 0.3s; }
        .acc-group[open] .acc-summary::before { transform: rotate(90deg); }
        .acc-content { padding: 25px 20px 0 20px; background: var(--bg-color); border-radius: 0 0 var(--radius-md) var(--radius-md);}

        /* Special Performance Accordion Colors */
        .special-group { border-color: rgba(59, 130, 246, 0.3); }
        .special-summary { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .special-summary:hover { background: rgba(59, 130, 246, 0.15); }
    </style>
</head>
<body class="dark-mode">

<div class="container">
    <div class="header">
        <div class="header-top">
            <div>
                <h1 data-i18n="title">FUNDAMENTAL REPORT</h1>
                <p id="last-update-desc" style="color: var(--text-sub); margin: 5px 0 0 0; font-size: 12px; font-weight: 600;"></p>
            </div>
            <div class="settings-content">
                <div class="set-group">
                    <button class="set-btn" id="btn-en" onclick="changeLang('en')">EN</button> 
                    <button class="set-btn active" id="btn-vi" onclick="changeLang('vi')">VI</button>
                </div>
                <div class="status-divider"></div>
                <div class="set-group">
                    <button class="set-btn" id="btn-light" onclick="changeTheme('light')">Light</button> 
                    <button class="set-btn active" id="btn-dark" onclick="changeTheme('dark')">Dark</button>
                </div>
                <div class="status-divider"></div>
                <div class="set-group">
                    <input type="range" id="fontSizeSlider" min="11" max="16" value="13" oninput="changeFontSize(this.value)"> 
                </div>
                <div class="status-divider"></div>
                <div class="set-group">
                    <span id="st-supa" class="status-badge" style="color: var(--primary);" data-i18n="st_init">Đang khởi tạo kết nối...</span>
                </div>
            </div>
        </div>
        
        <div class="filters">
            <div class="filter-group">
                <label>Area</label>
                <select id="flt-area" onchange="userTriggerUpdate('area')"><option value="ALL">-- Tất cả --</option></select>
            </div>
            <div class="filter-group">
                <label>CDM</label>
                <select id="flt-cdm" onchange="userTriggerUpdate('cdm')"><option value="ALL">-- Tất cả --</option></select>
            </div>
            <div class="filter-group">
                <label>KAM</label>
                <select id="flt-kam" onchange="userTriggerUpdate('kam')"><option value="ALL">-- Tất cả --</option></select>
            </div>
            <div class="filter-group">
                <label>KAE/DSR</label>
                <select id="flt-kae" onchange="userTriggerUpdate('kae')"><option value="ALL">-- Tất cả --</option></select>
            </div>
            <div class="filter-group" id="filter-cat-container">
                <label>Category (Brand)</label>
                <select id="flt-cat" onchange="userTriggerUpdate('cat')"><option value="ALL">-- Tất cả --</option></select>
            </div>
        </div>
    </div>

    <div class="main-tabs">
        <button class="tab-btn active" onclick="switchMainTab('tab_overview', this)" data-i18n="tab_overview">OVERVIEW</button>
        <button class="tab-btn" onclick="switchMainTab('tab_brand', this)" data-i18n="tab_brand">BY BRAND</button>
    </div>

    <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="switchSubTab('cdm', this)">BY CDM</button>
        <button class="sub-tab-btn" onclick="switchSubTab('kam', this)">BY KAM</button>
        <button class="sub-tab-btn" onclick="switchSubTab('kae', this)">BY SALES TEAM</button>
    </div>

    <div id="table-wrapper-main"></div>

</div>

<script>
    // ======================================================================
    // 0. BIẾN TOÀN CỤC & TÍNH NGÀY THÁNG
    // ======================================================================
    let dbMaster = [], dbSales = [];
    
    let statusMap = {}; 
    let statusTracker = {}; 
    
    let currentMainTab = 'tab_overview', currentSubTab = 'cdm';
    let TIME_COLS = [], CATS = []; 
    const METRICS = ["Coverage (outlets)", "Active Outlets", "Active Rate (%)", "AVG SKU/ invoice", "AVG Value/ invoice (VND)", "Performance (VND)"];
    const monthOrder = { "jan":1, "feb":2, "mar":3, "apr":4, "may":5, "jun":6, "jul":7, "aug":8, "sep":9, "oct":10, "nov":11, "dec":12 };

    let lastUpdateDateStr = "";
    (function calculateLastUpdateDate() {
        let d = new Date();
        let utc = d.getTime() + (d.getTimezoneOffset() * 60000);
        let gmt7Date = new Date(utc + (3600000 * 7)); 
        gmt7Date.setDate(gmt7Date.getDate() - 1);     
        let day = String(gmt7Date.getDate()).padStart(2, '0');
        let month = String(gmt7Date.getMonth() + 1).padStart(2, '0');
        let year = gmt7Date.getFullYear();
        lastUpdateDateStr = `${day}/${month}/${year}`;
    })();

    // ======================================================================
    // 1. TỪ ĐIỂN SONG NGỮ (I18N)
    // ======================================================================
    const dict = {
        vi: {
            title: "FUNDAMENTAL REPORT", desc: "Cập nhật lần cuối: ",
            tab_overview: "OVERVIEW", tab_brand: "BY BRAND",
            st_init: "Đang khởi tạo...", st_load: "Đang tải dữ liệu...", st_proc: "Đang xử lý...", st_done: "✅ Dữ liệu sẵn sàng", st_err: "❌ Lỗi kết nối",
            no_data: "Không có dữ liệu phù hợp với bộ lọc hiện tại",
            inactive_staff: "Nhân sự thôi việc / Không hoạt động",
            special_perf: "Special Performance"
        },
        en: {
            title: "FUNDAMENTAL REPORT", desc: "Last updated: ",
            tab_overview: "OVERVIEW", tab_brand: "BY BRAND",
            st_init: "Initializing...", st_load: "Loading data...", st_proc: "Processing...", st_done: "✅ Data Ready", st_err: "❌ Connection Error",
            no_data: "No valid data matches the current filters",
            inactive_staff: "Resigned / Inactive Staff",
            special_perf: "Special Performance"
        }
    };

    let currentLang = 'vi';

    function changeLang(lang) {
        currentLang = lang;
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        document.getElementById('btn-vi').classList.toggle('active', lang === 'vi');
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            let key = el.getAttribute('data-i18n');
            if (dict[currentLang][key]) el.innerText = dict[currentLang][key];
        });
        document.getElementById('last-update-desc').innerText = dict[currentLang]['desc'] + lastUpdateDateStr;
        if(dbMaster && dbMaster.length > 0) renderActiveTab();
    }
    changeLang(currentLang);

    // ======================================================================
    // 2. UI CÀI ĐẶT & HELPERS
    // ======================================================================
    function changeTheme(theme) {
        if (theme === 'dark') document.body.classList.add('dark-mode');
        else document.body.classList.remove('dark-mode');
        document.getElementById('btn-dark').classList.toggle('active', theme === 'dark');
        document.getElementById('btn-light').classList.toggle('active', theme === 'light');
    }

    function changeFontSize(val) { document.body.style.fontSize = val + 'px'; }

    function updateStatus(textKey, colorVar) {
        let st = document.getElementById('st-supa');
        st.innerText = dict[currentLang][textKey] || textKey;
        st.style.color = colorVar ? `var(${colorVar})` : 'var(--text-main)';
    }

    function executeWithLoading(callback) {
        updateStatus('st_proc', '--primary');
        document.getElementById('table-wrapper-main').style.opacity = '0.4';
        setTimeout(() => {
            callback();
            document.getElementById('table-wrapper-main').style.opacity = '1';
            updateStatus('st_done', '--color-tot');
        }, 10); 
    }

    const fmt = (n) => new Intl.NumberFormat('en-US').format(Math.round(n || 0));
    const fmtPct = (n) => (n || 0).toFixed(1) + '%';
    const fmtFloat = (n) => (n || 0).toFixed(1);

    function getMonthIndex(mStr) {
        let s = String(mStr).toLowerCase();
        for (let k in monthOrder) {
            if (s.includes(k)) return monthOrder[k];
        }
        return 0;
    }

    const cleanName = (name, isKamField = false, areaName = "", monthStr = "") => {
        let raw = String(name || "").trim();
        let match = raw.match(/[✔️✅☑️❌✖️✕✗✘✓]/);
        let cleanStr = raw.replace(/[✔️✅☑️❌✖️✕✗✘✓]/g, '').trim();
        
        let icon = '';
        if (match) {
            if (['❌', '✖️', '✕', '✗', '✘'].includes(match[0])) icon = '❌';
            else icon = '✔️';
        }

        if (isKamField) {
            cleanStr = cleanStr.toUpperCase(); 
            if (typeof kamMap !== 'undefined') {
                let areaKey = String(areaName || "").toUpperCase().trim() + "|" + cleanStr;
                if (kamMap[areaKey]) cleanStr = kamMap[areaKey];
                else if (kamMap[cleanStr]) cleanStr = kamMap[cleanStr];
            }
        }
        
        if (icon && monthStr) {
            let mIdx = getMonthIndex(monthStr);
            if (!statusTracker[cleanStr] || statusTracker[cleanStr].month < mIdx) {
                statusTracker[cleanStr] = { month: mIdx, icon: icon };
                statusMap[cleanStr] = icon;
            } else if (statusTracker[cleanStr].month === mIdx) {
                if (icon === '❌') {
                    statusTracker[cleanStr].icon = '❌';
                    statusMap[cleanStr] = '❌';
                }
            }
        }
        return cleanStr;
    };

    const getCdm = (cleanKam, areaName, monthStr = "", rawKam = "") => {
        let cdmName = "Chưa phân bổ CDM";
        if (typeof cdmMap !== 'undefined') {
            let exactAreaKey = String(areaName || "").trim() + "|" + cleanKam;
            let upperAreaKey = String(areaName || "").toUpperCase().trim() + "|" + cleanKam;
            if (cdmMap[exactAreaKey]) cdmName = cdmMap[exactAreaKey];
            else if (cdmMap[upperAreaKey]) cdmName = cdmMap[upperAreaKey];
            else if (cdmMap[cleanKam]) cdmName = cdmMap[cleanKam];
        }

        let match = cdmName.match(/[✔️✅☑️❌✖️✕✗✘✓]/);
        let cleanCdm = cdmName.replace(/[✔️✅☑️❌✖️✕✗✘✓]/g, '').trim();
        let icon = '';
        if (match) {
             if (['❌', '✖️', '✕', '✗', '✘'].includes(match[0])) icon = '❌';
             else icon = '✔️';
        }
        
        if (monthStr && cleanCdm && cleanCdm !== "Chưa phân bổ CDM") {
            let mIdx = getMonthIndex(monthStr);
            if (!statusTracker[cleanCdm] || statusTracker[cleanCdm].month < mIdx) {
                statusTracker[cleanCdm] = { month: mIdx, icon: icon };
                statusMap[cleanCdm] = icon;
            } else if (statusTracker[cleanCdm].month === mIdx) {
                if (icon === '❌') {
                    statusTracker[cleanCdm].icon = '❌';
                    statusMap[cleanCdm] = '❌';
                }
            }
        }
        return cleanCdm;
    };

    // ======================================================================
    // 3. ENGINE XỬ LÝ (TÍCH HỢP CACHE VÀ LỌC DOVEMEN)
    // ======================================================================
    function init(useCache = false) {
        updateStatus('st_proc', '--primary');
        
        let activeMonths = new Set(), activeCats = new Set();
        dbMaster = []; dbSales = [];
        statusMap = {}; statusTracker = {};

        let rawMasterData = useCache ? window.rawMasterCache : [];
        let rawSalesData = useCache ? window.rawSalesCache : [];

        if (!useCache) {
            if (typeof dbMasterM5 !== 'undefined') { rawMasterData = rawMasterData.concat(dbMasterM5); rawSalesData = rawSalesData.concat(dbSalesM5); }
            if (typeof dbMasterM6 !== 'undefined') { rawMasterData = rawMasterData.concat(dbMasterM6); rawSalesData = rawSalesData.concat(dbSalesM6); }
            if (typeof dbMasterM7 !== 'undefined') { rawMasterData = rawMasterData.concat(dbMasterM7); rawSalesData = rawSalesData.concat(dbSalesM7); }
            if (typeof dbMasterM8 !== 'undefined') { rawMasterData = rawMasterData.concat(dbMasterM8); rawSalesData = rawSalesData.concat(dbSalesM8); }
            window.rawMasterCache = rawMasterData;
            window.rawSalesCache = rawSalesData;
        }

        rawMasterData.forEach(d => {
            if(!d || !d.cusCode) return;
            d.month = (d.month || "").toString().trim();
            if(d.month) activeMonths.add(d.month);
            d.area = d.area ? String(d.area).trim() : "Unknown Area";
            
            d.raw_kam = d.raw_kam || d.kam || "";
            d.raw_kae = d.raw_kae || d.kae || "";

            d.kam = cleanName(d.raw_kam, true, d.area, d.month);
            d.cdm = getCdm(d.kam, d.area, d.month, d.raw_kam); 
            d.kae = cleanName(d.raw_kae, false, d.area, d.month);
            dbMaster.push(d);
        });

        rawSalesData.forEach(d => {
            if(!d || !d.cusCode) return;
            if(d.cat) {
                let catName = String(d.cat).trim().toUpperCase();
                if (catName === 'DISPLAY' || catName === 'DOVEMEN') return; 
                d.cat = catName;
                activeCats.add(catName);
            }
            d.month = (d.month || "").toString().trim();
            d.area = d.area ? String(d.area).trim() : "Unknown Area";
            
            d.raw_kam = d.raw_kam || d.kam || "";
            d.raw_kae = d.raw_kae || d.kae || "";

            d.kam = cleanName(d.raw_kam, true, d.area, d.month);
            d.cdm = getCdm(d.kam, d.area, d.month, d.raw_kam); 
            d.kae = cleanName(d.raw_kae, false, d.area, d.month);
            d.invId = d.invoiceId || d.invId || d.orderId || (d.cusCode + '|' + d.month + '|' + (d.week || ''));
            dbSales.push(d);
        });

        TIME_COLS = Array.from(activeMonths).sort((a,b) => getMonthIndex(a) - getMonthIndex(b));
        CATS = Array.from(activeCats).sort();

        // ÉP DẤU ❌ CHO NHỮNG NHÂN SỰ KHÔNG CÓ TRONG THÁNG MỚI NHẤT
        if (TIME_COLS.length > 0) {
            let latestGlobalMonthIdx = getMonthIndex(TIME_COLS[TIME_COLS.length - 1]);
            for (let name in statusTracker) {
                if (statusTracker[name].month < latestGlobalMonthIdx) {
                    statusMap[name] = '❌'; 
                } else {
                    if (statusTracker[name].icon) statusMap[name] = statusTracker[name].icon;
                }
            }
        }

        initFilters();
        executeWithLoading(renderActiveTab);
    }

    // ======================================================================
    // 4. BỘ LỌC (FILTERS)
    // ======================================================================
    function initFilters() {
        populateDropdown('flt-area', [...new Set(dbMaster.map(d => d.area))]);
        updateDropdowns('area');
        populateDropdown('flt-cat', CATS);
    }

    function populateDropdown(id, options) {
        document.getElementById(id).innerHTML = `<option value="ALL">-- Tất cả --</option>` + options.filter(Boolean).sort().map(o => `<option value="${o}">${o}</option>`).join('');
    }

    function getVal(id) { return document.getElementById(id).value; }
    
    function userTriggerUpdate(changedLevel) { executeWithLoading(() => { updateDropdowns(changedLevel); renderActiveTab(); }); }

    function updateDropdowns(changedLevel) {
        let selArea = getVal('flt-area'), selCdm = getVal('flt-cdm'), selKam = getVal('flt-kam');
        let filtered = dbMaster.filter(d => 
            (selArea === 'ALL' || d.area === selArea) &&
            (changedLevel === 'area' || selCdm === 'ALL' || d.cdm === selCdm) &&
            ((changedLevel === 'area' || changedLevel === 'cdm') || selKam === 'ALL' || d.kam === selKam)
        );
        if (changedLevel === 'area') {
            populateDropdown('flt-cdm', [...new Set(filtered.map(d => d.cdm))]);
            populateDropdown('flt-kam', [...new Set(filtered.map(d => d.kam))]);
            populateDropdown('flt-kae', [...new Set(filtered.map(d => d.kae))]);
        } else if (changedLevel === 'cdm') {
            populateDropdown('flt-kam', [...new Set(filtered.map(d => d.kam))]);
            populateDropdown('flt-kae', [...new Set(filtered.map(d => d.kae))]);
        } else if (changedLevel === 'kam') {
            populateDropdown('flt-kae', [...new Set(filtered.map(d => d.kae))]);
        }
    }

    // ======================================================================
    // 5. THUẬT TOÁN TÍNH TỐI ƯU O(N) TÁCH THEO TỪNG NHÂN SỰ
    // ======================================================================
    function switchMainTab(tabId, btn) {
        currentMainTab = tabId;
        document.querySelectorAll('.main-tabs .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        executeWithLoading(renderActiveTab);
    }

    function switchSubTab(subId, btn) {
        currentSubTab = subId;
        document.querySelectorAll('.sub-tabs .sub-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        executeWithLoading(renderActiveTab);
    }

    function compileData(isTab2, groupKey) {
        let entities = {}; 
        let entityCov = {};
        let fArea = getVal('flt-area'), fCdm = getVal('flt-cdm'), fKam = getVal('flt-kam'), fKae = getVal('flt-kae'), fCat = getVal('flt-cat');

        dbMaster.forEach(d => {
            if (fArea !== 'ALL' && d.area !== fArea) return;
            if (fCdm !== 'ALL' && d.cdm !== fCdm) return;
            if (fKam !== 'ALL' && d.kam !== fKam) return;
            if (fKae !== 'ALL' && d.kae !== fKae) return;

            let eName = d[groupKey];
            if (!entityCov[eName]) {
                entityCov[eName] = { area: d.area, m: {} };
                TIME_COLS.forEach(m => entityCov[eName].m[m] = new Set());
            }
            if (TIME_COLS.includes(d.month)) entityCov[eName].m[d.month].add(d.cusCode);
        });

        dbSales.forEach(d => {
            if (fArea !== 'ALL' && d.area !== fArea) return;
            if (fCdm !== 'ALL' && d.cdm !== fCdm) return;
            if (fKam !== 'ALL' && d.kam !== fKam) return;
            if (fKae !== 'ALL' && d.kae !== fKae) return;
            if (fCat !== 'ALL' && d.cat !== fCat) return; 

            let eName = d[groupKey];
            if (!entities[eName]) entities[eName] = { area: d.area, brands: {} };

            let bKey = isTab2 ? d.cat : 'OVERVIEW';
            
            if (!entities[eName].brands[bKey]) {
                entities[eName].brands[bKey] = { m: {} };
                TIME_COLS.forEach(m => entities[eName].brands[bKey].m[m] = { actSet: new Set(), sales: 0, skus: 0, invSet: new Set() });
            }

            if (TIME_COLS.includes(d.month)) {
                let mx = entities[eName].brands[bKey].m[d.month];
                mx.actSet.add(d.cusCode);
                mx.sales += (d.sales || 0); mx.skus += (d.skuLines || 0); mx.invSet.add(d.invId);
            }
        });

        if (!isTab2) {
            Object.keys(entityCov).forEach(eName => {
                if (!entities[eName]) entities[eName] = { area: entityCov[eName].area, brands: {} };
                if (!entities[eName].brands['OVERVIEW']) {
                     entities[eName].brands['OVERVIEW'] = { m: {} };
                     TIME_COLS.forEach(m => entities[eName].brands['OVERVIEW'].m[m] = { actSet: new Set(), sales: 0, skus: 0, invSet: new Set() });
                }
            });
        }

        return { entities, entityCov };
    }

    // ======================================================================
    // 6. RENDER GIAO DIỆN (CÓ NHÓM ĐẶC BIỆT CHO KAM BÁN HÀNG TẠI DÒNG KAE)
    // ======================================================================
    function renderActiveTab() {
        let isTab2 = currentMainTab === 'tab_brand';
        let container = document.getElementById('table-wrapper-main');
        let labelMap = { 'cdm': 'CDM', 'kam': 'KAM', 'kae': 'KAE/DSR' };
        let entityLabel = labelMap[currentSubTab];

        let { entities, entityCov } = compileData(isTab2, currentSubTab);
        let eNames = Object.keys(entities).sort();

        if (eNames.length === 0) {
            container.innerHTML = `<div class="table-container" style="padding:40px; text-align:center; color:var(--text-sub); border:none; box-shadow:none; font-size:1.1em;">${dict[currentLang]['no_data']}</div>`;
            return;
        }

        let activeEntities = [];
        let inactiveEntities = [];
        let specialEntities = [];

        eNames.forEach(e => {
            let isInactive = statusMap[e] === '❌';
            let isSpecial = currentSubTab === 'kae' && e.toUpperCase().startsWith('KAM');
            
            if (isInactive) inactiveEntities.push(e);
            else if (isSpecial) specialEntities.push(e);
            else activeEntities.push(e);
        });

        const buildListHtml = (list) => {
            let htmlChunk = '';
            list.forEach(eName => {
                let entityData = entities[eName];
                let brands = Object.keys(entityData.brands).sort();
                if (isTab2 && brands.length === 0) return;

                let icon = statusMap[eName] ? `${statusMap[eName]} ` : '';
                
                htmlChunk += `<div class="entity-section">`;
                htmlChunk += `<h3 class="entity-title">${entityLabel}: ${icon}${eName}</h3>`;
                
                htmlChunk += `<div class="table-container"><table><thead><tr>
                            <th class="col-sticky-1" style="width: 100px;">Area</th>
                            ${isTab2 ? '<th class="col-sticky-2" style="width: 120px;">Brand</th>' : ''}
                            <th style="width: 250px; text-align: left;">Fundamental</th>
                            ${TIME_COLS.map(m => `<th>${m}</th>`).join('')}
                        </tr></thead><tbody>`;

                brands.forEach(bName => {
                    let bData = entityData.brands[bName];
                    for(let i=0; i<6; i++) {
                        let rHtml = '';
                        if (i === 0) {
                            rHtml += `<td rowspan="6" class="col-sticky-1">${entityData.area}</td>`;
                            if (isTab2) rHtml += `<td rowspan="6" class="col-sticky-2" style="color:var(--warning-border); font-weight: bold;">${bName}</td>`;
                        }
                        
                        rHtml += `<td class="metric-name">${METRICS[i]}</td>`;
                        
                        TIME_COLS.forEach(m => {
                            let cov = (entityCov[eName] && entityCov[eName].m[m]) ? entityCov[eName].m[m].size : 0;
                            let mx = bData.m[m];
                            let act = mx.actSet.size, sls = mx.sales, invs = mx.invSet.size, skus = mx.skus;
                            
                            let val = 0;
                            if (i === 0) val = fmt(cov); 
                            else if (i === 1) val = `<span class="val-primary">${fmt(act)}</span>`; 
                            else if (i === 2) val = fmtPct(cov > 0 ? (act/cov)*100 : 0); 
                            else if (i === 3) val = fmtFloat(invs > 0 ? (skus/invs) : 0); 
                            else if (i === 4) val = fmt(invs > 0 ? (sls/invs) : 0); 
                            else if (i === 5) val = `<span class="val-success">${fmt(sls)}</span>`; 
                            rHtml += `<td>${val}</td>`;
                        });
                        htmlChunk += `<tr class="${i%2===0 ? 'row-highlight' : ''}">${rHtml}</tr>`;
                    }
                });
                htmlChunk += `</tbody></table></div></div>`;
            });
            return htmlChunk;
        };

        let finalHtml = buildListHtml(activeEntities);

        // 1. Accordion cho Nhóm Special Performance (KAM bán hàng)
        if (specialEntities.length > 0) {
            let specialHtml = buildListHtml(specialEntities);
            if (specialHtml) {
                let sumText = `${dict[currentLang]['special_perf']} (${specialEntities.length})`;
                finalHtml += `
                <details class="acc-group special-group">
                    <summary class="acc-summary special-summary">${sumText}</summary>
                    <div class="acc-content">
                        ${specialHtml}
                    </div>
                </details>`;
            }
        }

        // 2. Accordion cho Nhóm Nghỉ Việc
        if (inactiveEntities.length > 0) {
            let inactiveHtml = buildListHtml(inactiveEntities);
            if (inactiveHtml) {
                let sumText = `${dict[currentLang]['inactive_staff']} (${inactiveEntities.length})`;
                finalHtml += `
                <details class="acc-group">
                    <summary class="acc-summary">${sumText}</summary>
                    <div class="acc-content">
                        ${inactiveHtml}
                    </div>
                </details>`;
            }
        }

        container.innerHTML = finalHtml || `<div class="table-container" style="padding:40px; text-align:center; color:var(--text-sub); border:none; box-shadow:none; font-size:1.1em;">${dict[currentLang]['no_data']}</div>`;
    }
</script>

<!-- ======================================================================
     7. INDEXED-DB CACHE V3 & SUPABASE LOADER
     ====================================================================== -->
<script>
(async function () {
    const CACHE_DB = 'RTM_Cache_DB_V3'; 
    const CACHE_STORE = 'datasets';
    const CACHE_KEY = 'daily_rtm_data';

    function getDB() {
        return new Promise((resolve, reject) => {
            let req = indexedDB.open(CACHE_DB, 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore(CACHE_STORE);
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e.target.error);
        });
    }

    async function loadFromCache() {
        try {
            let db = await getDB();
            return new Promise((resolve, reject) => {
                let tx = db.transaction(CACHE_STORE, 'readonly');
                let req = tx.objectStore(CACHE_STORE).get(CACHE_KEY);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        } catch(e) { return null; }
    }

    async function saveToCache(dataObj) {
        try {
            let db = await getDB();
            let tx = db.transaction(CACHE_STORE, 'readwrite');
            tx.objectStore(CACHE_STORE).put(dataObj, CACHE_KEY);
        } catch(e) { console.warn("Không thể lưu cache.", e); }
    }

    function handleFatalError(title, subtitle) {
        updateStatus('st_err', '--color-khong-hq');
        alert(`${title}\n${subtitle}`);
    }

    if (!window.supabase) { handleFatalError("LỖI THƯ VIỆN", "Không thể tải thư viện Supabase"); return; }

    const SUPABASE_URL = 'https://mrqldgycwovpbmzdeuyz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_itZfZBVw7bxE184tGh7x8A_0_r-QB5p';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET_NAME = 'data';
    const HUB_URL = 'https://nguyen842-ai.github.io/Tong-hop-bao-cao/'; 

    try {
        updateStatus('st_load', '--primary');
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        if (sessionError || !session) { window.location.href = HUB_URL; return; }

        let todayStr = new Date().toDateString();
        let cachedData = await loadFromCache();
        var version = '?t=' + new Date().getTime();
        var localScripts = ['kamMap.js', 'cdmMap.js'];

        if (cachedData && cachedData.date === todayStr) {
            window.rawMasterCache = cachedData.rawMaster;
            window.rawSalesCache = cachedData.rawSales;

            let mapLoaded = 0;
            localScripts.forEach(file => {
                let script = document.createElement('script');
                script.src = file + version;
                script.onload = script.onerror = () => {
                    mapLoaded++;
                    if (file.includes('cdmMap') && typeof cdmMap === 'undefined') window.cdmMap = {};
                    if (file.includes('kamMap') && typeof kamMap === 'undefined') window.kamMap = {};
                    if (mapLoaded === localScripts.length) init(true);
                };
                document.body.appendChild(script);
            });
            return;
        }

        updateStatus('st_proc', '--primary');
        var secureDataFiles = ['dataM5.js', 'dataM6.js', 'dataM7.js', 'dataM8.js']; 
        const { data: signedUrlsData, error } = await supabase.storage.from(BUCKET_NAME).createSignedUrls(secureDataFiles, 60);
        if (error || !signedUrlsData) throw error;

        var scriptsToLoad = [];
        localScripts.forEach(file => scriptsToLoad.push({ url: file + version, type: 'local' }));
        signedUrlsData.forEach(item => {
            if (item.error) throw new Error(item.path);
            scriptsToLoad.push({ url: item.signedUrl, type: 'secure' });
        });

        var loadedScripts = 0, hasError = false;
        scriptsToLoad.forEach(function(item) {
            var script = document.createElement('script');
            script.src = item.url;
            script.onload = function() {
                if (hasError) return;
                loadedScripts++;
                if (item.url.includes('cdmMap') && typeof cdmMap === 'undefined') window.cdmMap = {};
                if (item.url.includes('kamMap') && typeof kamMap === 'undefined') window.kamMap = {};
                if (loadedScripts === scriptsToLoad.length) {
                    init(false); 
                    saveToCache({ rawMaster: window.rawMasterCache, rawSales: window.rawSalesCache, date: todayStr });
                }
            };
            script.onerror = function() {
                if (item.type === 'local') {
                    if (item.url.includes('cdmMap')) window.cdmMap = {}; 
                    if (item.url.includes('kamMap')) window.kamMap = {};
                    loadedScripts++;
                    if (loadedScripts === scriptsToLoad.length && !hasError) {
                        init(false);
                        saveToCache({ rawMaster: window.rawMasterCache, rawSales: window.rawSalesCache, date: todayStr });
                    }
                } else {
                    hasError = true;
                    handleFatalError("LỖI KẾT NỐI", `Truy cập file bảo mật bị từ chối.`); 
                }
            };
            document.body.appendChild(script);
        });
    } catch (err) { handleFatalError("LỖI BẢO MẬT", "Không có quyền truy cập dữ liệu."); }
})();
</script>
