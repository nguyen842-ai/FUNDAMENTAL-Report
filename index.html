<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RTM Fundamental & Brand Analytics</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" href="faviconTCI.png">
    
    <!-- Thư viện Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================================
           1. CẤU HÌNH DARK THEME PREMIUM
           ========================================================= */
        :root {
            --bg-main: #16181D;
            --bg-card: #21232A;
            --color-1: #0B486B; --color-2: #3B8686; --color-3: #79BD9A; --color-4: #A8DBA8; --color-5: #CFF09E;
            --primary: var(--color-4);
            --secondary: var(--color-2);
            --text-main: #FFFFFF;
            --text-muted: #A0AAB5;
            --border-color: rgba(121, 189, 154, 0.2);
            --border-radius: 12px; 
            --accent-warning: #fbbf24;
            --accent-success: var(--color-5);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); font-size: 13px; overflow-x: hidden; padding: 20px; }

        /* =========================================================
           2. MÀN HÌNH LOADING SUPABASE
           ========================================================= */
        #loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-main); z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.4s ease;
        }
        #loader-wrapper.hidden { opacity: 0; visibility: hidden; }
        .spinner-container { position: relative; width: 60px; height: 60px; margin-bottom: 20px; }
        .spinner-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 3px solid transparent; }
        .spinner-ring:nth-child(1) { border-top-color: var(--primary); animation: spin 1s linear infinite; }
        .spinner-ring:nth-child(2) { border-bottom-color: var(--secondary); animation: spin-reverse 1.2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        .loader-text { color: var(--primary); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; animation: pulse 1s infinite; text-align: center;}
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* =========================================================
           3. HEADER & TABS
           ========================================================= */
        .header { margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .header h1 { color: var(--primary); font-size: 24px; font-weight: 800; margin-bottom: 5px; text-transform: uppercase; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; font-size: 11px;}
        .tab-btn.active { background: var(--primary); color: var(--bg-main); }

        /* =========================================================
           4. BỘ LỌC THÁC ĐỔ (FILTERS)
           ========================================================= */
        .filters { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; background: var(--bg-card); padding: 15px; border-radius: var(--border-radius); border: 1px solid var(--border-color);}
        .filter-group { display: flex; flex-direction: column; gap: 5px; min-width: 150px; flex-grow: 1; max-width: 250px;}
        .filter-group label { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
        .filter-group select { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; outline: none; cursor: pointer; font-weight: 600;}
        .filter-group select:focus { border-color: var(--primary); }

        /* =========================================================
           5. DYNAMIC TABLE
           ========================================================= */
        .table-container { overflow-x: auto; background: var(--bg-card); border-radius: var(--border-radius); border: 1px solid var(--border-color); max-height: 70vh; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 1000px; }
        
        th { background: var(--secondary); color: var(--text-main); padding: 12px; font-weight: bold; text-align: center; border: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; font-size: 11px; text-transform: uppercase;}
        td { padding: 10px; border: 1px solid var(--border-color); text-align: right; color: var(--text-main); }
        
        /* Freeze first columns for scrolling */
        .col-sticky-1 { position: sticky; left: 0; background: var(--bg-card); z-index: 5; text-align: left; font-weight: bold; }
        .col-sticky-2 { position: sticky; left: 100px; background: var(--bg-card); z-index: 5; text-align: left; font-weight: bold; }
        .col-sticky-3 { position: sticky; left: 250px; background: var(--bg-card); z-index: 5; text-align: left; font-weight: bold; }
        
        /* Z-index fix for top-left corners */
        th.col-sticky-1, th.col-sticky-2, th.col-sticky-3 { z-index: 15; }

        .metric-name { text-align: left !important; color: var(--text-muted); font-weight: 600;}
        .row-highlight { background: rgba(121, 189, 154, 0.05); }
        .val-primary { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH LOADING SUPABASE -->
    <div id="loader-wrapper">
        <div class="spinner-container"><div class="spinner-ring"></div><div class="spinner-ring"></div></div>
        <div class="loader-text">Loading Data...</div>
    </div>

    <div class="header">
        <h1>BÁO CÁO FUNDAMENTAL & BRAND</h1>
        <p style="color: var(--text-muted);">Phân tích: Độ phủ, Active, Drop Size theo cấu trúc Nhân sự</p>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1')">TAB 1: FUNDAMENTAL OVERVIEW</button>
        <button class="tab-btn" onclick="switchTab('tab2')">TAB 2: BRAND CATEGORY</button>
    </div>

    <!-- BỘ LỌC THÁC ĐỔ -->
    <div class="filters">
        <div class="filter-group">
            <label>Area</label>
            <select id="flt-area" onchange="applyFilters('area')"><option value="ALL">Tất cả Area</option></select>
        </div>
        <div class="filter-group">
            <label>CDM</label>
            <select id="flt-cdm" onchange="applyFilters('cdm')"><option value="ALL">Tất cả CDM</option></select>
        </div>
        <div class="filter-group">
            <label>KAM</label>
            <select id="flt-kam" onchange="applyFilters('kam')"><option value="ALL">Tất cả KAM</option></select>
        </div>
        <div class="filter-group">
            <label>KAE/DSR</label>
            <select id="flt-kae" onchange="applyFilters('kae')"><option value="ALL">Tất cả KAE/DSR</option></select>
        </div>
        <div class="filter-group" id="filter-cat-container">
            <label>Category (Brand)</label>
            <select id="flt-cat" onchange="applyFilters('cat')"><option value="ALL">Tất cả Category</option></select>
        </div>
    </div>

    <!-- VÙNG HIỂN THỊ BẢNG -->
    <div class="table-container" id="table-wrapper">
        <!-- Bảng sẽ được render bằng Javascript ở đây -->
    </div>

<script>
    // ======================================================================
    // BIẾN TOÀN CỤC (GLOBAL VARIABLES)
    // ======================================================================
    let dbMaster = []; 
    let dbSales = [];
    let currentTab = 'tab1';
    
    // Mảng sẽ được sinh động sau khi kéo dữ liệu
    let TIME_COLS = []; 
    let CATS = []; 

    const METRICS = [
        "Coverage (outlets)", 
        "Active Outlets (distinct count)", 
        "Active Rate (%)", 
        "AVG SKU/ invoice", 
        "AVG Value/ invoice (VND)", 
        "Performance (VND)"
    ];

    const monthOrder = { "jan":1, "feb":2, "mar":3, "apr":4, "may":5, "jun":6, "jul":7, "aug":8, "sep":9, "oct":10, "nov":11, "dec":12 };

    // Helper Functions
    const fmt = (n) => new Intl.NumberFormat('en-US').format(Math.round(n || 0));
    const fmtPct = (n) => (n || 0).toFixed(1) + '%';
    const fmtFloat = (n) => (n || 0).toFixed(1);

    // Chuẩn hóa chuỗi tên nhân sự
    const cleanName = (name, isKamField = false, areaName = "") => {
        let cleanStr = String(name || "").replace(/[✔️❌]/g, '').trim();
        if (isKamField) {
            cleanStr = cleanStr.toUpperCase(); 
            if (typeof kamMap !== 'undefined') {
                let areaKey = String(areaName || "").toUpperCase().trim() + "|" + cleanStr;
                if (kamMap[areaKey]) return kamMap[areaKey];
                if (kamMap[cleanStr]) return kamMap[cleanStr];
            }
        }
        return cleanStr;
    };

    // Hàm lấy CDM theo đúng chuẩn map: {"Khu vực|KAM": "CDM"}
    const getCdm = (cleanKam, areaName) => {
        if (typeof cdmMap !== 'undefined') {
            let exactAreaKey = String(areaName || "").trim() + "|" + cleanKam;
            let upperAreaKey = String(areaName || "").toUpperCase().trim() + "|" + cleanKam;
            
            // Tìm theo "Khu vực|KAM" trước
            if (cdmMap[exactAreaKey]) return cdmMap[exactAreaKey];
            if (cdmMap[upperAreaKey]) return cdmMap[upperAreaKey];
            
            // Tìm theo KAM độc lập (dự phòng)
            if (cdmMap[cleanKam]) return cdmMap[cleanKam];
        }
        return "Chưa phân bổ CDM";
    };

    // ======================================================================
    // LOGIC SAU KHI DỮ LIỆU ĐƯỢC TẢI XONG BỞI SUPABASE
    // ======================================================================
    function init() {
        dbMaster = []; dbSales = [];
        // Nối dữ liệu từ các file
        if (typeof dbMasterM5 !== 'undefined') { dbMaster = dbMaster.concat(dbMasterM5); dbSales = dbSales.concat(dbSalesM5); }
        if (typeof dbMasterM6 !== 'undefined') { dbMaster = dbMaster.concat(dbMasterM6); dbSales = dbSales.concat(dbSalesM6); }
        if (typeof dbMasterM7 !== 'undefined') { dbMaster = dbMaster.concat(dbMasterM7); dbSales = dbSales.concat(dbSalesM7); }
        if (typeof dbMasterM8 !== 'undefined') { dbMaster = dbMaster.concat(dbMasterM8); dbSales = dbSales.concat(dbSalesM8); }

        let activeMonths = new Set();
        let activeCats = new Set();

        // 1. Tiền xử lý dbMaster
        dbMaster.forEach(d => {
            if(!d || !d.cusCode) return;
            d.month = (d.month || "").toString().trim();
            if(d.month) activeMonths.add(d.month);
            
            d.area = d.area ? String(d.area).trim() : "Unknown Area";
            d.kam = cleanName(d.kam, true, d.area);
            d.cdm = getCdm(d.kam, d.area); 
            d.kae = cleanName(d.kae, false, d.area);
        });

        // 2. Tiền xử lý dbSales
        let filteredSales = [];
        dbSales.forEach(d => {
            if(!d || !d.cusCode) return;
            
            // Xử lý Cat (Category / Brand) & LOẠI BỎ CATEGORY LÀ "DISPLAY"
            if(d.cat) {
                let catName = String(d.cat).trim().toUpperCase();
                // Lọc bỏ ngay nếu là hàng trưng bày
                if (catName === 'DISPLAY') return; 
                
                d.cat = catName;
                activeCats.add(catName);
            }

            d.month = (d.month || "").toString().trim();
            d.area = d.area ? String(d.area).trim() : "Unknown Area";
            d.kam = cleanName(d.kam, true, d.area);
            d.cdm = getCdm(d.kam, d.area); 
            d.kae = cleanName(d.kae, false, d.area);
            
            // Hóa đơn ID
            d.invId = d.invoiceId || d.invId || d.orderId || (d.cusCode + '|' + d.month + '|' + (d.week || ''));
            
            // Lưu lại vào mảng data sạch
            filteredSales.push(d);
        });
        
        // Cập nhật lại biến dbSales chỉ chứa Data không có "DISPLAY"
        dbSales = filteredSales;

        // Gán mảng TIME_COLS động dựa trên dữ liệu thật (Sắp xếp theo tháng)
        TIME_COLS = Array.from(activeMonths).sort((a,b) => (monthOrder[a.toLowerCase()]||99) - (monthOrder[b.toLowerCase()]||99));
        
        // Gán mảng CATS động
        CATS = Array.from(activeCats).sort();

        // Ẩn Loading Screen
        setTimeout(() => { document.getElementById('loader-wrapper').classList.add('hidden'); }, 300);

        // Khởi tạo UI
        initFilters();
        renderTable();
    }

    // ======================================================================
    // LOGIC BỘ LỌC THÁC ĐỔ (WATERFALL)
    // ======================================================================
    function initFilters() {
        populateDropdown('flt-area', [...new Set(dbMaster.map(d => d.area))]);
        updateDropdowns('area'); // Khởi tạo cấp dưới
        populateDropdown('flt-cat', CATS);
    }

    function populateDropdown(id, options) {
        let sel = document.getElementById(id);
        sel.innerHTML = `<option value="ALL">Tất cả</option>` + options.filter(Boolean).sort().map(o => `<option value="${o}">${o}</option>`).join('');
    }

    function getVal(id) { return document.getElementById(id).value; }
    
    function applyFilters(changedLevel) {
        updateDropdowns(changedLevel);
        renderTable();
    }

    function updateDropdowns(changedLevel) {
        let selArea = getVal('flt-area');
        let selCdm = getVal('flt-cdm');
        let selKam = getVal('flt-kam');

        // Lọc Master Data dựa theo cấp bậc hiện tại để lấy options cho cấp dưới
        let filtered = dbMaster.filter(d => 
            (selArea === 'ALL' || d.area === selArea) &&
            (changedLevel === 'area' || selCdm === 'ALL' || d.cdm === selCdm) &&
            ((changedLevel === 'area' || changedLevel === 'cdm') || selKam === 'ALL' || d.kam === selKam)
        );

        if (changedLevel === 'area') {
            populateDropdown('flt-cdm', [...new Set(filtered.map(d => d.cdm))]);
            populateDropdown('flt-kam', [...new Set(filtered.map(d => d.kam))]);
            populateDropdown('flt-kae', [...new Set(filtered.map(d => d.kae))]);
        } else if (changedLevel === 'cdm') {
            populateDropdown('flt-kam', [...new Set(filtered.map(d => d.kam))]);
            populateDropdown('flt-kae', [...new Set(filtered.map(d => d.kae))]);
        } else if (changedLevel === 'kam') {
            populateDropdown('flt-kae', [...new Set(filtered.map(d => d.kae))]);
        }
    }

    // ======================================================================
    // LOGIC ENGINE (TÍNH TOÁN & GOM NHÓM DỮ LIỆU RENDER)
    // ======================================================================
    function switchTab(tabId) {
        currentTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderTable();
    }

    function renderTable() {
        let fArea = getVal('flt-area');
        let fCdm = getVal('flt-cdm');
        let fKam = getVal('flt-kam');
        let fKae = getVal('flt-kae');
        let fCat = getVal('flt-cat');

        // Xác định cấp độ View (Cột 2)
        let viewLevel = 'CDM';
        let groupKey = 'cdm';
        if (fKae !== 'ALL' || fKam !== 'ALL') { viewLevel = 'KAE/DSR'; groupKey = 'kae'; }
        else if (fCdm !== 'ALL') { viewLevel = 'KAM'; groupKey = 'kam'; }

        let dataMap = {};

        function initEntityBlock(key, areaStr, entityStr, brandStr = null) {
            if (!dataMap[key]) {
                dataMap[key] = {
                    area: areaStr, entity: entityStr, brand: brandStr,
                    m: {}
                };
                TIME_COLS.forEach(m => dataMap[key].m[m] = { covSet: new Set(), actSet: new Set(), sales: 0, skus: 0, invSet: new Set() });
            }
        }

        // Chạy qua dbMaster để tính Coverage (Mẫu số)
        dbMaster.forEach(d => {
            if (fArea !== 'ALL' && d.area !== fArea) return;
            if (fCdm !== 'ALL' && d.cdm !== fCdm) return;
            if (fKam !== 'ALL' && d.kam !== fKam) return;
            if (fKae !== 'ALL' && d.kae !== fKae) return;

            let eName = d[groupKey];
            if (currentTab === 'tab1') {
                initEntityBlock(eName, d.area, eName);
                if (TIME_COLS.includes(d.month)) dataMap[eName].m[d.month].covSet.add(d.cusCode);
            } else {
                // Tab 2: Phương án A (Coverage bằng nhau cho mọi Brands)
                CATS.forEach(c => {
                    if (fCat !== 'ALL' && c !== fCat) return; 
                    let compKey = eName + '|' + c;
                    initEntityBlock(compKey, d.area, eName, c);
                    if (TIME_COLS.includes(d.month)) dataMap[compKey].m[d.month].covSet.add(d.cusCode);
                });
            }
        });

        // Chạy qua dbSales để tính Active, Sales, DropSize
        dbSales.forEach(d => {
            if (fArea !== 'ALL' && d.area !== fArea) return;
            if (fCdm !== 'ALL' && d.cdm !== fCdm) return;
            if (fKam !== 'ALL' && d.kam !== fKam) return;
            if (fKae !== 'ALL' && d.kae !== fKae) return;
            if (fCat !== 'ALL' && d.cat !== fCat) return; 

            let eName = d[groupKey];
            
            if (currentTab === 'tab1') {
                if (dataMap[eName] && TIME_COLS.includes(d.month)) {
                    let mx = dataMap[eName].m[d.month];
                    mx.actSet.add(d.cusCode);
                    mx.sales += (d.sales || 0);
                    mx.skus += (d.skuLines || 0);
                    mx.invSet.add(d.invId);
                }
            } else {
                let compKey = eName + '|' + d.cat;
                if (dataMap[compKey] && TIME_COLS.includes(d.month)) {
                    let mx = dataMap[compKey].m[d.month];
                    mx.actSet.add(d.cusCode);
                    mx.sales += (d.sales || 0);
                    mx.skus += (d.skuLines || 0);
                    mx.invSet.add(d.invId);
                }
            }
        });

        // Xây dựng Table HTML
        let isTab2 = currentTab === 'tab2';
        let html = `
            <table>
                <thead>
                    <tr>
                        <th class="col-sticky-1" style="width: 100px;">Area</th>
                        <th class="col-sticky-2" style="width: 150px;">${viewLevel}</th>
                        ${isTab2 ? '<th class="col-sticky-3" style="width: 120px;">Brand</th>' : ''}
                        <th style="width: 200px; text-align: left;">Fundamental</th>
                        ${TIME_COLS.map(m => `<th>${m}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
        `;

        let keys = Object.keys(dataMap).sort();

        if (keys.length === 0) {
            html += `<tr><td colspan="${isTab2 ? 4 + TIME_COLS.length : 3 + TIME_COLS.length}" style="text-align:center; padding: 30px;">Không có dữ liệu phù hợp với bộ lọc</td></tr>`;
        }

        keys.forEach(k => {
            let rowData = dataMap[k];
            let rows = [];
            
            for(let i=0; i<6; i++) {
                let rHtml = '';
                // Hợp nhất ô (rowspan) cho Area, Entity, Brand
                if (i === 0) {
                    rHtml += `<td rowspan="6" class="col-sticky-1">${rowData.area}</td>`;
                    rHtml += `<td rowspan="6" class="col-sticky-2" style="color:var(--primary);">${rowData.entity}</td>`;
                    if(isTab2) rHtml += `<td rowspan="6" class="col-sticky-3" style="color:var(--accent-warning);">${rowData.brand}</td>`;
                }
                
                rHtml += `<td class="metric-name">${METRICS[i]}</td>`;
                
                // Trải ngang các tháng
                TIME_COLS.forEach(m => {
                    let dM = rowData.m[m];
                    let cov = dM.covSet.size;
                    let act = dM.actSet.size;
                    let sls = dM.sales;
                    let invs = dM.invSet.size;
                    let skus = dM.skus;

                    let val = 0;
                    if (i === 0) val = fmt(cov); 
                    else if (i === 1) val = `<span class="val-primary">${fmt(act)}</span>`; 
                    else if (i === 2) val = fmtPct(cov > 0 ? (act/cov)*100 : 0); 
                    else if (i === 3) val = fmtFloat(invs > 0 ? (skus/invs) : 0); 
                    else if (i === 4) val = fmt(invs > 0 ? (sls/invs) : 0); 
                    else if (i === 5) val = `<span style="color:var(--accent-success); font-weight:bold;">${fmt(sls)}</span>`; 

                    rHtml += `<td>${val}</td>`;
                });
                
                rows.push(`<tr class="${i%2===0 ? 'row-highlight' : ''}">${rHtml}</tr>`);
            }
            html += rows.join('');
        });

        html += `</tbody></table>`;
        document.getElementById('table-wrapper').innerHTML = html;
    }
</script>

    }

        return;
    }

    const SUPABASE_URL = 'https://mrqldgycwovpbmzdeuyz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_itZfZBVw7bxE184tGh7x8A_0_r-QB5p';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET_NAME = 'data';

        var version = '?t=' + new Date().getTime();
        var localScripts = ['kamMap.js', 'cdmMap.js']; // Các map nội bộ GitHub
        var secureDataFiles = ['dataM5.js', 'dataM6.js', 'dataM7.js', 'dataM8.js']; 

        const { data: signedUrlsData, error } = await supabase.storage
            .from(BUCKET_NAME)
            .createSignedUrls(secureDataFiles, 60);

        if (error || !signedUrlsData) throw error;

        var scriptsToLoad = [];
        localScripts.forEach(file => scriptsToLoad.push({ url: file + version, type: 'local' }));
        signedUrlsData.forEach(item => {
            if (item.error) throw new Error(item.path);
            scriptsToLoad.push({ url: item.signedUrl, type: 'secure' });
        });

        var loadedScripts = 0;
        var hasError = false;

        scriptsToLoad.forEach(function(item) {
            var script = document.createElement('script');
            script.src = item.url;
            
            script.onload = function() {
                if (hasError) return;
                loadedScripts++;
                // Chống sập nếu file map trống
                if (item.url.includes('cdmMap') && typeof cdmMap === 'undefined') window.cdmMap = {};
                if (item.url.includes('kamMap') && typeof kamMap === 'undefined') window.kamMap = {};

                if (loadedScripts === scriptsToLoad.length) {
                    if (typeof init === 'function') init();
                }
            };
            
            script.onerror = function() {
                // Bỏ qua lỗi 404 cho file map trên Github (giúp trang vẫn sống)
                if (item.type === 'local') {
                    console.warn("Chưa tìm thấy hoặc lỗi tải file map: " + item.url);
                    if (item.url.includes('cdmMap')) window.cdmMap = {}; 
                    if (item.url.includes('kamMap')) window.kamMap = {};
                    
                    loadedScripts++;
                    if (loadedScripts === scriptsToLoad.length && !hasError) {
                        if (typeof init === 'function') init();
                    }
                } 
                else {
                    hasError = true;
                    let fileName = item.url.split('?')[0].substring(0, 50) + '...';
                    handleFatalError("LỖI KẾT NỐI DỮ LIỆU", `Không có quyền truy cập file bảo mật: <b>${fileName}</b><br>Vui lòng tải lại trang hoặc quay lại Trang Hub.`); 
                }
            };
            
            document.body.appendChild(script);
        });

    } catch (err) {
        console.error("Lỗi:", err);
        handleFatalError("LỖI BẢO MẬT", "Không có quyền truy cập dữ liệu (Access Denied). Vui lòng đăng nhập lại qua Trang Hub.");
    }
})();
</script>
</body>
</html>
